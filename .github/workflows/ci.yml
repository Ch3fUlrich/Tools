name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `labeled` re-runs CI when merge-ready is added: that run is the FULL suite.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suite (a dispatch is always a full run; the input exists so callers can pass it through)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # CI-SMART-SELECT: a PR push runs only the job(s) its diff needs (map:
  # .github/smart-ci.json). The FULL suite runs on the merge-ready label,
  # workflow_dispatch, every push to main, and whenever the selection is unknown
  # or a workflow / dependency / CI file changed. "CI merge gate" (bottom) is the
  # check that proves the full run happened; the two required checks below are
  # skipped (= pass) when their job was not selected.
  smart:
    name: Smart CI select
    uses: Ch3fUlrich/AutoOS/.github/workflows/smart-ci.yml@lane/ci-smart-select
    with:
      selector_repo: Ch3fUlrich/AutoOS
      selector_ref: lane/ci-smart-select
      runs_on: ${{ toJSON('ubuntu-latest') }}
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

  backend:
    name: Backend tests (Postgres + Redis)
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).backend }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tools
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tools -d tools" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set environment
        run: |
          echo "TEST_DATABASE_URL=postgres://tools:pass@localhost:5432/tools" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://tools:pass@localhost:5432/tools" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          for f in $(ls backend/migrations/*.sql | sort); do
            echo "Applying migration: $f"
            PGPASSWORD=pass psql -h localhost -U tools -d tools -f "$f"
          done

      - name: Run backend tests
        run: |
          cd backend
          cargo test --workspace --all-features --no-fail-fast

      - name: Run clippy
        run: |
          cd backend
          cargo clippy -- -D warnings

      - name: Check formatting
        run: |
          cd backend
          cargo fmt -- --check

  frontend:
    name: Frontend tests
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter frontend test

      - name: Run ESLint
        run: pnpm --filter frontend run lint

      - name: Run Stylelint
        run: pnpm --filter frontend run lint:css

      # The Rust side has had cargo-audit for a while; the npm tree had no equivalent gate.
      # `--prod` is the one that blocks: the frontend is a static export, so production
      # dependencies are what actually reach a visitor. Dev-only advisories (currently six,
      # via commitlint, vitest/jsdom and eslint plugins) cannot, so they are reported for
      # visibility and left to Dependabot rather than blocking every unrelated PR.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Report dev dependency advisories
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Build frontend
        run: pnpm --filter frontend run build

  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [ smart, backend, frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build backend (release)
        run: |
          cd backend
          cargo build --release --locked

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend (production)
        run: pnpm --filter frontend run build

      - name: Package build artifacts (zip)
        run: |
          mkdir -p artifacts
          cp backend/target/release/tools-backend artifacts/ || true
          cp -r frontend/out artifacts/frontend-out || true
          cd artifacts
          zip -r ../build-artifacts.zip . || true

      - name: Upload zipped artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-zip
          path: build-artifacts.zip

  # Red only when a job failed or was cancelled. A selected-only PR run passes
  # but leaves the commit status "Full suite (merge-ready)" pending; the full run
  # (label merge-ready, or dispatch full=true) sets it to success. Make both
  # "CI merge gate" and "Full suite (merge-ready)" required checks for merge.
  merge-gate:
    name: CI merge gate
    if: always()
    needs: [ smart, backend, frontend, build-artifacts ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Selected jobs passed; report whether the run was full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.smart.outputs.full }}
          REASON: ${{ needs.smart.outputs.reason }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "event=$EVENT full=$FULL results=$RESULTS reason=$REASON"
          ctx="Full suite (merge-ready)"
          post() { gh api "repos/$REPO/statuses/$SHA" -f state="$1" -f context="$ctx" -f description="$2" >/dev/null || echo "::warning::could not set the $ctx status"; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) post failure "a CI job ended $r"; echo "::error::a CI job ended $r"; exit 1 ;;
            esac
          done
          if [ "$EVENT" = pull_request ] && [ "$FULL" != true ]; then
            post pending "selected-only run: add the merge-ready label for the full suite"
            echo "::notice::selected-only run passed; the full suite (label merge-ready or dispatch full=true) is still required before merge"
          else
            post success "full suite passed"
          fi
