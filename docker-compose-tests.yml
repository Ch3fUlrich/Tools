services:
  postgres:
    image: postgres:16-alpine
    container_name: tools-postgres-tests
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
