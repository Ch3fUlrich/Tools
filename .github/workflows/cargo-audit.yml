name: cargo-audit

on:
  schedule:
    # Weekly run on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: {}
  push:
    branches:
      - '**'
    paths:
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'

# Least-privilege default: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        working-directory: ./backend
        # RUSTSEC-2023-0071: rsa Marvin attack (medium, no fix available — transitive via sqlx-mysql/openidconnect)
        run: cargo audit --ignore RUSTSEC-2023-0071
