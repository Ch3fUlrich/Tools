name: Frontend CI

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend.yml'

# Least-privilege default: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Security audit
      run: pnpm audit --audit-level high --prod
      continue-on-error: true

    - name: Run frontend tests
      run: pnpm --filter frontend test --run

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
      with:
        # vitest outputs lcov to frontend/coverage/lcov.info when run from frontend dir
        files: frontend/coverage/lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: Ch3fUlrich/Tools

    - name: Upload frontend coverage artifact (fallback)
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-coverage-lcov
        path: frontend/coverage/lcov.info
    
    - name: Run ESLint
      run: pnpm --filter frontend run lint

    - name: Run Stylelint
      run: pnpm --filter frontend run lint:css
    
    - name: Build
      run: pnpm --filter frontend run build
    
    - name: Check for build artifacts
      run: test -d frontend/.next
