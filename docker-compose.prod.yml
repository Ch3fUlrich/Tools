# Production deployment using pre-built GHCR images.
#
# Port configuration:
#   Set NGINX_PORT in your environment or a .env file (default: 8080).
#   Example:
#     NGINX_PORT=9000 docker compose -f docker-compose.prod.yml up -d
#   Or create .env (or docker/.env):
#     NGINX_PORT=9000
#
# Image version:
#   Set TOOLS_VERSION to pin a specific release (default: latest).
#   Example: TOOLS_VERSION=v1.2.3

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ch3fulrich}/tools-frontend:${TOOLS_VERSION:-latest}
    container_name: tools-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    environment:
      - PORT=${NGINX_PORT:-8080}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=10m
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1] first and
      # nginx's `listen ${PORT};` binds IPv4 only, so the probe got "connection
      # refused" and the container sat unhealthy while serving traffic fine.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${NGINX_PORT:-8080}/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - tools-prod-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ch3fulrich}/tools-backend:${TOOLS_VERSION:-latest}
    container_name: tools-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RUST_LOG=info
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      - DATABASE_URL=${DATABASE_URL:-postgres://tools:pass@postgres:5432/tools}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Where the browser is sent back to after a successful Authelia login.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080/}
      # Single sign-on. With these set, /api/auth/oidc/start redirects to the provider and
      # the callback provisions the local user from the ID token.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-Authelia}
      # Email + password sign-in. Off unless explicitly enabled: Authelia is the only login
      # method this deployment offers.
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=20m
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - tools-prod-network

  postgres:
    image: postgres:16-alpine
    container_name: tools-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-tools}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tools} -d ${POSTGRES_DB:-tools}"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run/postgresql:noexec,nosuid,nodev,size=10m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - tools-prod-network

  redis:
    image: redis:7-alpine
    container_name: tools-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=10m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - tools-prod-network

networks:
  tools-prod-network:
    driver: bridge

volumes:
  postgres-prod-data:
    name: tools_postgres_prod_data
